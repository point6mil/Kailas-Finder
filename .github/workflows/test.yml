name: Test

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content":"✅ GitHub has successfully connected to Discord"}' \
          "${{ secrets.DISCORD_WEBHOOK }}"
