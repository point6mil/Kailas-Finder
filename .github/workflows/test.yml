name: Kailas Finder

on:
  workflow_dispatch:

jobs:
  finder:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Finder
        run: python finder.py
